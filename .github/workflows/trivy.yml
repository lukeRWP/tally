name: trivy

# Filesystem vulnerability scan. Catches CVEs in installed dependencies
# (npm/pip/etc.), misconfigurations in Dockerfiles, and known-bad
# patterns in config. Fails CI on HIGH or CRITICAL severity findings.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Re-scan weekly so newly-disclosed CVEs against existing dependencies
  # surface even when nobody is pushing.
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for SARIF upload to Code Scanning tab
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.x

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@52485aec7be33610227643b0fe83936b8b5f061a # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
