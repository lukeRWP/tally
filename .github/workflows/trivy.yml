name: trivy

# Filesystem vulnerability scan. Catches CVEs in installed dependencies
# (npm/pip/etc.), misconfigurations in Dockerfiles, and known-bad
# patterns in config. Fails CI on HIGH or CRITICAL severity findings.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Re-scan weekly so newly-disclosed CVEs against existing dependencies
  # surface even when nobody is pushing.
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for SARIF upload to Code Scanning tab
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
