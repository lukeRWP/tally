name: trivy

# Filesystem vulnerability scan. Catches CVEs in installed dependencies
# (npm/pip/etc.), misconfigurations in Dockerfiles, and known-bad
# patterns in config. Fails CI on HIGH or CRITICAL severity findings.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Re-scan weekly so newly-disclosed CVEs against existing dependencies
  # surface even when nobody is pushing.
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC

env:
  # Genuine Trivy environment variables (trivy.dev/docs/configuration): every
  # trivy invocation in the job picks these up, including the ones inside
  # trivy-action's composite steps.
  #
  # The two scans share one cache directory and NEITHER of them updates the
  # database. The ~110 MB pull happens exactly once, in the single retried step
  # below, so a network blip during the download can no longer redden a security
  # gate for a reason that has nothing to do with security. What that costs is
  # Trivy's own staleness check, which is why the freshness assertion below is
  # not optional — see .github/scripts/trivy-db-fresh.py.
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
  TRIVY_SKIP_DB_UPDATE: 'true'

  # Ours. Deliberately NOT TRIVY_-prefixed: that namespace belongs to Trivy's
  # flags, and TRIVY_VERSION in particular collides with `--version`.
  #
  # The version is trivy-action v0.36.0's own default, pinned here so the cache
  # key can name the binary that produced the DB — the DB carries a schema
  # version tied to the reader. Bumping the CLI (prevailing-winds#315 P1 wants
  # v0.71.2) is a deliberate act that invalidates the cache, as it should.
  SCAN_TRIVY_VERSION: v0.70.0
  DB_MAX_AGE_HOURS: '48'

jobs:
  # Distinct check context: gitleaks also reports a job named "scan" — the
  # duplicate context defeated a required trivy gate (#208). Required on master.
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for SARIF upload to Code Scanning tab
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.x

      # Installed here rather than by trivy-action (which is told to skip its
      # own setup below) because a trivy binary has to exist BEFORE the scans:
      # the DB pull and the freshness assertion both need one.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.SCAN_TRIVY_VERSION }}
          cache: true

      - name: Cache key date (UTC)
        id: dbkey
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # Date-keyed. Upstream rebuilds trivy-db every few hours and Trivy's own
      # metadata marks a DB due for refresh 24h after it was built, so one key
      # per UTC day is the coarsest key that still tracks the data.
      #
      # restore-keys deliberately lets an older day through. A near-miss cache
      # is still a useful head start, and letting it through is safe *here*
      # precisely because the next step decides out loud whether it is fresh
      # enough to scan against, instead of the cache making that call silently.
      #
      # Only db/ and policy/ are cached — the DB and the misconfig check bundle,
      # both of which are upstream artifacts. Trivy's scan-derived state under
      # the same directory is left out on purpose: caching analysis results
      # across commits is how a cache starts answering questions about the code
      # rather than about the vulnerability data.
      #
      # restore/save are split (rather than the combined actions/cache) so the
      # save can be made conditional on the assertion having passed. The
      # combined action's post-job save fires even when the job failed, which
      # would publish an unverified DB under today's key for every later run in
      # the repo to hit.
      - name: Restore Trivy DB cache
        id: db-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.TRIVY_CACHE_DIR }}/db
            ${{ env.TRIVY_CACHE_DIR }}/policy
          key: trivy-db-${{ env.SCAN_TRIVY_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.dbkey.outputs.date }}
          restore-keys: |
            trivy-db-${{ env.SCAN_TRIVY_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      # The ONLY step in this workflow that retries anything. It downloads a
      # database and evaluates nothing, so a retry here cannot convert a real
      # finding into a pass. The scans are never retried.
      - name: Ensure a fresh vulnerability DB (retry the download only)
        env:
          # The one step that is allowed to update the DB — the whole point of
          # the job-level skip is to funnel every download through here.
          TRIVY_SKIP_DB_UPDATE: 'false'
          CACHE_HIT: ${{ steps.db-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.db-cache.outputs.cache-matched-key }}
        run: |
          set -uo pipefail
          echo "Cache: exact-hit=${CACHE_HIT:-false} matched-key=${CACHE_MATCHED_KEY:-<none>}"

          if python3 .github/scripts/trivy-db-fresh.py; then
            echo "The cache served a usable DB. No download needed."
            exit 0
          fi

          # Delete first, so this really is a live pull. Trivy decides whether
          # to download by its own NextUpdate stamp, which is not the same
          # question this workflow is asking: hand it a DB it considers current
          # but we have judged unusable and `--download-db-only` is a no-op that
          # exits 0, leaving the assertion below to fail a job that no retry can
          # rescue. Removing the directory takes that decision away from it.
          echo "Falling back to a live DB pull."
          rm -rf "${TRIVY_CACHE_DIR:?TRIVY_CACHE_DIR must be set}/db"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              backoff=$(( (attempt - 1) * 10 ))
              echo "Retrying in ${backoff}s."
              sleep "$backoff"
            fi
            if trivy fs --download-db-only --no-progress; then
              echo "Vulnerability DB downloaded on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Trivy DB download failed (attempt ${attempt}/3)."
          done
          echo "::error::Trivy DB download failed 3 times. This is a download, not a finding — re-run the job."
          exit 1

      # THE MASKING GUARD. Nothing above is taken on trust: not the cache hit,
      # not the download's exit code. If this cannot prove the database the
      # scans are about to read is present and recent, the job stops here and no
      # scan runs at all.
      #
      # A red build is recoverable. A green scan against a stale DB is a gate
      # that quietly stopped covering everything disclosed since that DB was
      # built, and nobody finds out.
      - name: Assert the DB the scans will use is fresh
        id: db-assert
        run: |
          if ! python3 .github/scripts/trivy-db-fresh.py; then
            echo "::error::Refusing to scan: the vulnerability DB could not be shown to be fresh (see above). A scan against an unverified DB would report a false all-clear."
            exit 1
          fi
          # For the record, in the log, on every run: the DB timestamps the
          # scans below actually ran against.
          trivy --version

      # GATE: this is the pass/fail check. Use table output, which honors the
      # `severity` filter AND `.trivyignore` correctly. (The sarif format path
      # in trivy-action builds "all severities" and trips exit-code regardless
      # of the severity filter / ignore file — so it must NOT be the gate.)
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Both disabled in favour of the explicit steps above. The action's
          # built-in cache is an actions/cache with `restore-keys: cache-trivy-`
          # and no consumer-side check, so it can hand any DB still inside the
          # 7-day cache lifetime to a scan that will not comment on its age.
          skip-setup-trivy: true
          cache: false
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig   # CVEs + leaked secrets + IaC/Dockerfile misconfigs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          # The action does not auto-detect .trivyignore; pass it explicitly so
          # the documented suppressions in that file actually apply.
          trivyignores: .trivyignore

      # REPORT: non-gating SARIF for the Code Scanning tab (sarif's all-severity
      # behavior is fine here since exit-code is 0).
      #
      # Runs whatever the gate concluded (a report is most wanted when the gate
      # is red) but NOT when the freshness assertion failed: publishing a stale
      # scan to the Code Scanning tab is the same false all-clear, just filed
      # somewhere it will be believed for longer.
      - name: Trivy scan (SARIF report)
        if: ${{ !cancelled() && steps.db-assert.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          cache: false
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: 0
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore

      - name: Upload SARIF to Code Scanning
        if: ${{ !cancelled() && steps.db-assert.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@52485aec7be33610227643b0fe83936b8b5f061a # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # Last, so the misconfig check bundle the scans pull is saved alongside
      # the DB. Skipped on an exact-key hit (nothing new to store) and whenever
      # the DB was not proven fresh (never publish what was refused).
      - name: Save Trivy DB cache
        if: ${{ !cancelled() && steps.db-assert.outcome == 'success' && steps.db-cache.outputs.cache-hit != 'true' }}
        # A save that fails costs the next run a cold pull and nothing else. It
        # must not redden a security gate, and it cannot hide anything: the
        # freshness assertion is re-derived from the metadata on every run.
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.TRIVY_CACHE_DIR }}/db
            ${{ env.TRIVY_CACHE_DIR }}/policy
          key: trivy-db-${{ env.SCAN_TRIVY_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.dbkey.outputs.date }}
