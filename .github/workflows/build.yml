name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-client:
    name: Build Client
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-node
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          CI: true
          NODE_ENV: production
      - run: tar -czf tally-client.tar.gz -C client/dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tally-client
          path: tally-client.tar.gz
          retention-days: 30

  build-server:
    name: Build Server
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-node
      - run: npm ci
        working-directory: server
      - name: Syntax check all JS files
        run: node --check index.js && find src -name '*.js' -exec node --check {} +
        working-directory: server
      - run: tar -czf tally-server.tar.gz -C server index.js package.json package-lock.json src/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tally-server
          path: tally-server.tar.gz
          retention-days: 30

  build-db:
    name: Package Database
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - run: tar -czf tally-db.tar.gz SQL/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tally-db
          path: tally-db.tar.gz
          retention-days: 30

  deploy:
    name: Deploy to Production
    needs: [build-client, build-server, build-db]
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Preflight — verify secrets are configured
        run: |
          FAIL=0
          if [ -z "${{ vars.ORCHESTRATOR_URL }}" ]; then
            echo "::error::Repository variable ORCHESTRATOR_URL is not set"
            FAIL=1
          fi
          if [ -z "${{ secrets.ORCHESTRATOR_API_KEY }}" ]; then
            echo "::error::Repository secret ORCHESTRATOR_API_KEY is not set"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "Orchestrator URL: ${{ vars.ORCHESTRATOR_URL }}"

      - name: Deploy via Orchestrator
        env:
          ORCH_URL: ${{ vars.ORCHESTRATOR_URL }}
          ORCH_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          # V2 deploy endpoint — single-VM Docker compose at <vlan>.10
          # Trigger with retry (orchestrator may be restarting)
          for RETRY in 1 2 3; do
            RESULT=$(curl -s -w "\n%{http_code}" -X POST \
              "$ORCH_URL/api/_y_/apps/tally/envs/prod/v2/deploy" \
              -H "Authorization: Bearer $ORCH_KEY" \
              -H "Content-Type: application/json" \
              --max-time 30 \
              -d "{\"ref\": \"$GIT_REF\"}" 2>&1) || true
            HTTP_CODE=$(echo "$RESULT" | tail -1)
            BODY=$(echo "$RESULT" | sed '$d')

            if echo "$BODY" | jq -e '.success' > /dev/null 2>&1; then
              break
            fi

            echo "Attempt $RETRY failed (HTTP $HTTP_CODE): $BODY"
            if [ "$RETRY" -lt 3 ]; then
              echo "Retrying in 10s..."
              sleep 10
            else
              echo "::error::Failed to trigger deploy after 3 attempts"
              exit 1
            fi
          done

          # V2 returns .data.operationId (V1 returned .data.opId — keep fallback)
          OP=$(echo "$BODY" | jq -r '.data.operationId // .data.opId')
          echo "Operation: $OP"
          echo "Dashboard: $ORCH_URL/operations/$OP"

          # Poll for completion
          ATTEMPTS=0
          while [ $ATTEMPTS -lt 90 ]; do
            POLL=$(curl -s --max-time 10 \
              "$ORCH_URL/api/_x_/ops/$OP" \
              -H "Authorization: Bearer $ORCH_KEY" 2>&1) || true
            STATUS=$(echo "$POLL" | jq -r '.data.status' 2>/dev/null)
            case "$STATUS" in
              success)
                echo "Deploy succeeded"
                exit 0
                ;;
              failed)
                ERROR=$(echo "$POLL" | jq -r '.data.error // "unknown error"' 2>/dev/null)
                echo "::error::Deploy failed: $ERROR"
                echo "$POLL" | jq -r '.data.output // ""' 2>/dev/null | tail -30
                exit 1
                ;;
              *)
                ATTEMPTS=$((ATTEMPTS + 1))
                sleep 10
                ;;
            esac
          done
          echo "::error::Deploy timed out after 15 minutes"
          exit 1
        timeout-minutes: 20
