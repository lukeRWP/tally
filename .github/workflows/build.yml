name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

# The build-* jobs are SMOKE GATES, not producers: the orchestrator builds
# from its own fresh clone (CLAUDE.md CI/CD rule 5), so nothing here is
# shipped. They exist to stop a master push that cannot build on the runner's
# Node from ever reaching the deploy step. No artifacts are uploaded — the
# tarballs this workflow used to publish were never downloaded by anything
# (#352).
jobs:
  build-client:
    name: Build Client
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-node
      # --no-audit: npm runs an audit after installing, and the audit endpoint
      # it uses stalls indefinitely (see #380 / lukeRWP/prevailing-winds#845).
      # It hung this step for minutes on 2026-09-04. Auditing is the Security
      # Audit job's business, not the install's.
      - run: npm ci --no-audit --no-fund
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          CI: true
          NODE_ENV: production

  build-server:
    name: Build Server
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-node
      # --no-audit: npm runs an audit after installing, and the audit endpoint
      # it uses stalls indefinitely (see #380 / lukeRWP/prevailing-winds#845).
      # It hung this step for minutes on 2026-09-04. Auditing is the Security
      # Audit job's business, not the install's.
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Syntax check all JS files
        run: node --check index.js && find src -name '*.js' -exec node --check {} +
        working-directory: server
      # Same command the pw.json server build step runs on the orchestrator
      # (CI/CD rule 5: the two pipelines must produce equivalent results).
      # Never fails the job; see write-version.js's own contract.
      - name: Generate build version stamp
        run: node scripts/write-version.js
        working-directory: server

  deploy:
    name: Deploy to Production
    needs: [build-client, build-server]
    runs-on: self-hosted
    environment: prod
    # id-token: write lets this job mint GitHub Actions OIDC tokens — the orchestrator's CI
    # credential since 2026-09-26 (PW docs/CI-OIDC.md). A job-level block REPLACES the
    # workflow-level one, so contents: read is repeated.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Preflight — verify the orchestrator URL is configured
        run: |
          FAIL=0
          if [ -z "${{ vars.ORCHESTRATOR_URL }}" ]; then
            echo "::error::Repository variable ORCHESTRATOR_URL is not set"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "Orchestrator URL: ${{ vars.ORCHESTRATOR_URL }}"

      - name: Deploy via Orchestrator
        env:
          ORCH_URL: ${{ vars.ORCHESTRATOR_URL }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          # Every orchestrator call mints a FRESH GitHub OIDC token (the poll below outlives any
          # single token) and sends it — PW docs/CI-OIDC.md. The orchestrator accepts it only for
          # this repo's declared routes (PW orchestrator/api/src/config/ci-oidc.yml); no static
          # secret. A failed mint stops HERE, loudly, instead of sending an empty/"null" bearer.
          # No ::add-mask:: — echoed inside a function called from $(...), it would be captured
          # into the output, not seen by the runner; the token is never printed and expires fast.
          orch_curl() {
            local t
            t=$(curl -sS --fail --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pw-orchestrator" | jq -r '.value // empty') || t=""
            if [ -z "$t" ]; then
              echo "::error::could not mint a GitHub OIDC token (does the job have permissions: id-token: write?)" >&2
              return 97
            fi
            curl -H "Authorization: Bearer $t" "$@"
          }

          # V2 deploy endpoint — single-VM Docker compose at <vlan>.10
          # Trigger with retry (orchestrator may be restarting)
          for RETRY in 1 2 3; do
            RESULT=$(orch_curl -s -w "\n%{http_code}" -X POST \
              "$ORCH_URL/api/_y_/apps/tally/envs/prod/v2/deploy" \
              -H "Content-Type: application/json" \
              --max-time 30 \
              -d "{\"ref\": \"$GIT_REF\"}" 2>&1) || true
            HTTP_CODE=$(echo "$RESULT" | tail -1)
            BODY=$(echo "$RESULT" | sed '$d')

            if echo "$BODY" | jq -e '.success' > /dev/null 2>&1; then
              break
            fi

            echo "Attempt $RETRY failed (HTTP $HTTP_CODE): $BODY"
            if [ "$RETRY" -lt 3 ]; then
              echo "Retrying in 10s..."
              sleep 10
            else
              echo "::error::Failed to trigger deploy after 3 attempts"
              exit 1
            fi
          done

          # V2 returns .data.operationId (V1 returned .data.opId — keep fallback)
          OP=$(echo "$BODY" | jq -r '.data.operationId // .data.opId')
          echo "Operation: $OP"
          echo "Dashboard: $ORCH_URL/operations/$OP"

          # Poll for completion
          # GitHub runs this step under `bash -e`: an assignment takes its command's exit
          # status, so a jq parse error on a non-JSON poll (a failed OIDC mint's stderr, an
          # nginx page while the orchestrator restarts) used to end the step mid-deploy.
          # A poll that fails or isn't JSON is just a failed poll; give up only after 30
          # in a row. orch_curl's stderr stays out of POLL so it can never reach jq.
          ATTEMPTS=0
          FAILED_POLLS=0
          while [ $ATTEMPTS -lt 90 ]; do
            if ! POLL=$(orch_curl -sS --fail-with-body --max-time 10 \
                "$ORCH_URL/api/_x_/ops/$OP"); then
              POLL=""
            fi
            STATUS=$(printf '%s' "$POLL" | jq -r '.data.status // empty' 2>/dev/null) || STATUS=""
            if [ -z "$STATUS" ]; then
              FAILED_POLLS=$((FAILED_POLLS + 1))
              echo "Poll failed ($FAILED_POLLS consecutive)"
              if [ $FAILED_POLLS -ge 30 ]; then
                echo "::error::Gave up after 30 consecutive failed polls — check operation $OP on the orchestrator (the source of truth, rule 7)"
                exit 1
              fi
            else
              FAILED_POLLS=0
            fi
            case "$STATUS" in
              success)
                echo "Deploy succeeded"
                exit 0
                ;;
              failed)
                ERROR=$(printf '%s' "$POLL" | jq -r '.data.error // "unknown error"' 2>/dev/null) || ERROR="unknown error"
                echo "::error::Deploy failed: $ERROR"
                printf '%s' "$POLL" | jq -r '.data.output // ""' 2>/dev/null | tail -30 || true
                exit 1
                ;;
              cancelled)
                # PW #1357: a cancel ends the op `cancelled` (it used to end `failed`).
                echo "::error::Deploy was cancelled on the orchestrator (operation $OP)"
                printf '%s' "$POLL" | jq -r '.data.output // ""' 2>/dev/null | tail -20 || true
                exit 1
                ;;
              *)
                ATTEMPTS=$((ATTEMPTS + 1))
                sleep 10
                ;;
            esac
          done
          echo "::error::Deploy timed out after 15 minutes"
          exit 1
        timeout-minutes: 20
