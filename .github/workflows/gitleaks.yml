name: gitleaks

# Server-side backstop for the local pre-commit hook. Catches secrets
# that bypass the hook (contributor hasn't installed pre-commit, or
# committed via the GitHub web UI, or used --no-verify).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action calls GET /repos/.../pulls/:num/commits to enumerate
      # the PR commits; without this it 403s on pull_request events.
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.x
        with:
          # Full history needed so gitleaks scans every commit on PRs,
          # not just the diff. Slower (~1 min) but catches secrets that
          # were committed earlier on a branch.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin gitleaks binary to match local .pre-commit-config.yaml.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: ".gitleaks.toml"
