name: CI

on:
  # Every pull request, whatever its base — NOT just PRs into master.
  #
  # Scoped to master, a PR stacked on a long-lived feature branch (say a
  # follow-up onto an open PR's branch) matched no trigger, so GitHub reported
  # "no checks reported". That reads as "nothing to run" and is indistinguishable
  # at a glance from "everything passed" — the one state a reviewer must never
  # confuse for green. A stacked PR is exactly where that is most dangerous,
  # because its diff reaches master later via a branch whose own CI already went
  # green before the stacked change existed.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: ./.github/actions/setup-node
      - run: npm ci
        working-directory: client
      - run: ./node_modules/.bin/tsc --noEmit
        working-directory: client
      - run: ./node_modules/.bin/eslint . --max-warnings 0
        working-directory: client
      # Runs BEFORE the build: a failing test should stop the job at the cheap
      # step, and a broken build is not evidence about behaviour either way.
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          CI: true

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: ./.github/actions/setup-node
      # test/labels.geometry.test.js rasterises the real label PDFs with
      # `pdftoppm -r 203` and checks the printed QR / Code 128 module grid
      # against the canonical symbol data. Without poppler it SKIPS — which is
      # the one outcome worse than failing, because the geometry then looks
      # verified and is not. Keep this step next to the server tests.
      - name: Install poppler-utils (pdftoppm, for the label geometry test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
        working-directory: server
      - name: Lint
        run: ./node_modules/.bin/eslint .
        working-directory: server
      - name: Syntax check all JS files
        run: node --check index.js && find src -name '*.js' -exec node --check {} +
        working-directory: server
      - name: Unit tests
        run: npm test
        working-directory: server

  migration-gate:
    name: Migration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          # The gate compares against the PR base to decide whether SQL/ was
          # touched, so the base commit has to be in the local history.
          fetch-depth: 0
      # This job is a REQUIRED check, so it must report a conclusion on every
      # PR — a `paths:` filter on the workflow would leave it permanently
      # pending on PRs that don't touch SQL/ and block them forever. Instead it
      # always runs and short-circuits to green when there is nothing to gate.
      - name: Does this PR touch SQL/?
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- SQL/ | grep -q .; then
            echo "sql=true" >> "$GITHUB_OUTPUT"
          else
            echo "sql=false" >> "$GITHUB_OUTPUT"
            echo "No SQL/ changes — nothing to gate."
          fi
      # Boots MySQL 8.4 (prod's catalog version and docker-compose's pin),
      # applies SQL/init + the whole SQL/migrations chain, applies the chain
      # AGAIN and requires it to succeed, then byte-compares the resulting
      # schema against SQL/expected-schema.sql. See the script header and
      # CLAUDE.md CI/CD rule 9.
      #
      # ubuntu-latest is GitHub-hosted (only build.yml uses the self-hosted
      # runner), so docker is available and the script brings its own MySQL —
      # no service container, and the mysql/mysqldump used to produce the dump
      # are the ones from the 8.4 image, not whatever the runner has installed.
      - name: Migrations apply twice and match the expected schema
        if: steps.changes.outputs.sql == 'true'
        run: SQL/ci/migration-gate.sh

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: ./.github/actions/setup-node
      # No --production/--omit=dev: an omit filter makes npm fall back to
      # POST /-/npm/v1/security/audits/quick, which the registry is retiring
      # — it now stalls for minutes and then answers 400 ("This endpoint is
      # being retired. Use the bulk advisory endpoint instead."), which is
      # what red-carded this job on 2026-09-04 after 6m23s. Unfiltered audits
      # use the bulk endpoint: 2 s for both trees, measured. The trade is
      # that devDependency advisories now count too — with --audit-level=high
      # that is a deliberate gate, not noise (both trees are clean today:
      # server 3 moderate, client 0).
      - name: Audit server
        run: npm audit --audit-level=high
        working-directory: server
      - name: Audit client
        run: npm audit --audit-level=high
        working-directory: client
