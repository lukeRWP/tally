name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node
      - run: npm ci
        working-directory: client
      - run: npx tsc --noEmit
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          CI: true

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node
      - run: npm ci
        working-directory: server
      - name: Lint
        run: npx eslint .
        working-directory: server
      - name: Syntax check all JS files
        run: node --check index.js && find src -name '*.js' -exec node --check {} +
        working-directory: server
      - name: Unit tests
        run: npm test
        working-directory: server

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-node
      - name: Audit server
        run: npm audit --production --audit-level=high
        working-directory: server
      - name: Audit client
        run: npm audit --production --audit-level=high
        working-directory: client
